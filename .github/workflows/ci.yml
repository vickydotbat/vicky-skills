name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Main runs near five minutes; the cap leaves room for a slow runner and
    # still stops a hung step fast.
    timeout-minutes: 8
    steps:
      # A draft fails here and runs nothing else. Skipping would report as
      # passed and let a draft merge.
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # skill-change-tested compares the branch with origin/main.
          fetch-depth: 0
      # The red-first job repeats these installs: change both together.
      # The runner image has no JSON Schema validator, and this job has no declared shell to hold one.
      - name: Install check-jsonschema, the security kit's OSV file check
        run: pipx install check-jsonschema==0.38.0
      # The case-file build shrinks screenshots with ImageMagick, prints its PDF
      # with a headless browser, and its check reads the PDF with pdftotext.
      # apt-get update took 2m30s on one run, so it runs only when the
      # image's package lists can't install them.
      - name: Install ImageMagick and poppler-utils, and name the runner's Chrome as chromium, for the case-file build
        run: |
          pkgs=(); command -v convert >/dev/null || pkgs+=(imagemagick); command -v pdftotext >/dev/null || pkgs+=(poppler-utils)
          if [ ${#pkgs[@]} -gt 0 ]; then
            sudo apt-get install -y -q "${pkgs[@]}" || { sudo apt-get update -q && sudo apt-get install -y -q "${pkgs[@]}"; }
          fi
          command -v chromium >/dev/null || sudo ln -s "$(command -v google-chrome)" /usr/local/bin/chromium
      - name: tools-declared finds a runtime a script calls but tests/tools leaves out
        run: tests/tools-declared.test.sh
      - name: language-tutor's store, ledger, quiz pick, drill cap and profile keep the approved examples
        run: tests/language_tutor_approved_examples.test.sh
      - name: "language-tutor store edge cases: caps, blank settings, scripts, bad input, the settings file"
        run: tests/language-tutor-store.test.sh
      - name: Plugin layout
        run: tests/plugin-layout.test.sh
      - name: The security kit drafts an advisory only where its line says (SEC-1)
        run: tests/security_advisory_approved_examples.test.sh
      - name: The security kit's levels name the run behind each finding (SEC-3)
        run: tests/security_levels_approved_examples.test.sh
      - name: A CVE request and a publish wait on the user's own word (SEC-2)
        run: tests/advisory_guard_approved_examples.test.sh
      - name: A case file builds, checks and bundles as its examples say (CF-1 to CF-3)
        run: tests/case_file_approved_examples.test.sh
      - name: A case file lives in .case-files, knows its kind and builds every format (CF-5 to CF-7)
        run: tests/case_file_kinds_approved_examples.test.sh
      - name: The case-file build's markers, Markdown, browser and the check's PDF and label rules
        run: tests/case-file-markers.test.sh
      - name: A case file has contents, a label legend and a fixed layout, and one zip per case
