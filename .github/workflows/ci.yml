name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Plugin layout
        run: tests/plugin-layout.test.sh
      - name: Approved-spec guard
        run: tests/approved-spec-guard.test.sh
      - name: Draw chart
        run: tests/draw-chart.test.sh
