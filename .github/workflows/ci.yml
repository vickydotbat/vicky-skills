name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft fails here and runs nothing else. Skipping would report as
      # passed and let a draft merge.
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The red-first check reads the commits that added each approved test.
          fetch-depth: 0
      - name: Plugin layout
        run: tests/plugin-layout.test.sh
      - name: Approved-spec guard
        run: tests/approved-spec-guard.test.sh
      - name: Approved-spec guard follows a leading cd
        run: tests/approved_spec_guard_cd_approved_examples.test.sh
      - name: Skill steps
        run: tests/skill-steps.test.sh
      - name: Draw chart
        run: tests/draw-chart.test.sh
      - name: Star chart words
        run: tests/star_chart_words_approved_examples.test.sh
      - name: Black hole drawing
        run: tests/black_hole_drawing_approved_examples.test.sh
      - name: Tells lint
        run: tests/lint_tells_approved_examples.test.sh
      - name: Answer page
        run: tests/answer_page_approved_examples.test.sh
      - name: Examples are the seams
        run: tests/do_examples_approved_examples.test.sh
      - name: Brief mode memes
        run: tests/brief_mode_memes_approved_examples.test.sh
      - name: Red pen quick close
        run: tests/red_pen_quick_close_approved_examples.test.sh
      - name: Check ADR
        run: tests/check-adr.test.sh
      - name: After-push hook
        run: tests/after-push.test.sh
      - name: Skill links
        run: tests/skill-links.test.sh
      - name: Skill descriptions
        run: tests/skill-descriptions.test.sh
      - name: PR guard
        run: tests/pr-guard.test.sh
      - name: Issue guard
        run: tests/issue-guard.test.sh
      - name: Tea stdin guard
        run: tests/tea-stdin.test.sh
      - name: Local-path guard
        run: tests/local-path-guard.test.sh
      - name: Push-behind guard
        run: tests/push-behind-guard.test.sh
      - name: Step guard
        run: tests/step_guard_approved_examples.test.sh
      - name: Lesson hint
        run: tests/lesson-hint.test.sh
      - name: Engrave approved examples
        run: tests/engrave_approved_examples.test.sh
      - name: Merged-branch guard
        run: tests/merged-branch-guard.test.sh
      - name: Merged-branch approved examples
        run: tests/merged_branch_approved_examples.test.sh
      - name: Sup lessons approved examples
        run: tests/sup_lessons_approved_examples.test.sh
      - name: Engrave routing approved examples
        run: tests/engrave_route_approved_examples.test.sh
      - name: Poll pace
        run: tests/poll-pace.test.sh
      - name: Gamma-shift hook
        run: tests/gamma-shift.test.sh
      - name: Auto-tidy hook
        run: tests/auto-tidy.test.sh
      - name: Spark-joy hook
        run: tests/spark-joy.test.sh
      - name: Gate-notify hook
        run: tests/gate-notify.test.sh
      - name: Skill ledger hook
        run: tests/skill_ledger_approved_examples.test.sh
      - name: Idle skills
        run: tests/idle_skills_approved_examples.test.sh
      - name: Captain's log high points
        run: tests/captains_log_high_points_approved_examples.test.sh
      - name: Reader panel
        run: tests/reader_panel_approved_examples.test.sh
      - name: Ticket-drift hook
        run: tests/ticket_drift_approved_examples.test.sh
      - name: Hook exit codes
        run: tests/hook-exits.test.sh
      - name: Checkout guard decisions
        run: tests/checkout-guard.test.sh
      - name: Draft lock
        run: tests/draft-lock.test.sh
      - name: Red-first decisions
        run: tests/red-first.test.sh
      - name: Step guard decisions
        run: tests/step-guard.test.sh
      - name: Step guard on Gitea
        run: tests/step_guard_gitea_approved_examples.test.sh
      - name: Mutation proof guard
        run: tests/mutation-proof-guard.test.sh
      - name: Plane block guard
        run: tests/plane_block_approved_examples.test.sh
      - name: Goal-driven do, proof guard and hints
        run: tests/goal_driven_approved_examples.test.sh
      - name: Approved tests change only with a yes
        run: tests/approved_tests_yes_approved_examples.test.sh
      - name: Checkout guard
        run: tests/checkout_guard_approved_examples.test.sh
      - name: Red-first hooks and mutation proof
        run: tests/red_first_approved_examples.test.sh
      - name: Guard lets reads through
        run: tests/guard_reads_approved_examples.test.sh
      - name: Guard lets new files through
        run: tests/guard_new_file_approved_examples.test.sh
      - name: Guard steers instead of asking
        run: tests/guard_steers_approved_examples.test.sh
      - name: Faster mutation runner
        run: tests/mutation_speed_approved_examples.test.sh
      - name: Worktree by default
        run: tests/worktree_default_approved_examples.test.sh
      - name: Over-to-you stocks the test
        run: tests/over_to_you_stocks_approved_examples.test.sh
      - name: Lessons ledger
        run: tests/lesson_ledger_approved_examples.test.sh
      - name: Ask plainly
        run: tests/ask_plainly.test.sh
      - name: Red-pen grants
        run: tests/open-draft.test.sh
      - name: Lessons ledger edges
        run: tests/lesson-ledger.test.sh
      - name: Over-to-you builds from scratch
        run: tests/over_to_you_from_scratch_approved_examples.test.sh
      - name: Over-to-you quick notes
        run: tests/over_to_you_quick_notes_approved_examples.test.sh
      - name: Testing standards
        run: tests/testing_standards_approved_examples.test.sh
      - name: Cerebro mid-effort
        run: tests/cerebro_mid_effort_approved_examples.test.sh
      - name: Watch script
        run: tests/watch_approved_examples.test.sh
      - name: Watch script edges
        run: tests/watch.test.sh
      - name: Do receipts
        run: tests/receipt_approved_examples.test.sh
      - name: Mission brief
        run: tests/mission_brief_approved_examples.test.sh
      - name: Todo reminder
        run: tests/todo_reminder_approved_examples.test.sh
      - name: Todo reminder decisions
        run: tests/todo-reminder.test.sh
      - name: Red-pen samples
        run: tests/red_pen_samples_approved_examples.test.sh
      - name: Warp writes tests up front
        run: tests/warp_up_front_approved_examples.test.sh
      - name: Warp zero friction
        run: tests/warp_zero_friction_approved_examples.test.sh
      - name: User prompts are training wheels
        run: tests/training_wheels_approved_examples.test.sh
      - name: Over-to-you covers the whole branch
        run: tests/over_to_you_whole_branch_approved_examples.test.sh
      # The viewscreen band is a function-hook module; only Claude Code's own
      # mod test kit can load it.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: Viewscreen band
        run: tests/viewscreen_approved_examples.test.sh
      # The rule applies from the commit that added the check: an older
      # approved test was never asked to land red.
      - name: Red-first check
        if: github.event_name == 'pull_request'
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          added=$(git log --diff-filter=A --format=%H -1 -- plugins/vicky-skills/scripts/red-first-check.sh)
          if ! git merge-base --is-ancestor "$added" "$base"; then base=$added; fi
          plugins/vicky-skills/scripts/red-first-check.sh "$base"
