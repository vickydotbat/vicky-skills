name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft fails here and runs nothing else. Skipping would report as
      # passed and let a draft merge.
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Plugin layout
        run: tests/plugin-layout.test.sh
      - name: Approved-spec guard
        run: tests/approved-spec-guard.test.sh
      - name: Skill steps
        run: tests/skill-steps.test.sh
      - name: Draw chart
        run: tests/draw-chart.test.sh
      - name: Star chart words
        run: tests/star_chart_words_approved_examples.test.sh
      - name: Black hole drawing
        run: tests/black_hole_drawing_approved_examples.test.sh
      - name: Tells lint
        run: tests/lint_tells_approved_examples.test.sh
      - name: Answer page
        run: tests/answer_page_approved_examples.test.sh
      - name: Examples are the seams
        run: tests/do_examples_approved_examples.test.sh
      - name: Check ADR
        run: tests/check-adr.test.sh
      - name: After-push hook
        run: tests/after-push.test.sh
      - name: Skill links
        run: tests/skill-links.test.sh
      - name: Skill descriptions
        run: tests/skill-descriptions.test.sh
      - name: PR guard
        run: tests/pr-guard.test.sh
      - name: Issue guard
        run: tests/issue-guard.test.sh
      - name: Tea stdin guard
        run: tests/tea-stdin.test.sh
      - name: Local-path guard
        run: tests/local-path-guard.test.sh
      - name: Push-behind guard
        run: tests/push-behind-guard.test.sh
      - name: Step guard
        run: tests/step_guard_approved_examples.test.sh
      - name: Poll pace
        run: tests/poll-pace.test.sh
      - name: Gamma-shift hook
        run: tests/gamma-shift.test.sh
      - name: Auto-tidy hook
        run: tests/auto-tidy.test.sh
      - name: Spark-joy hook
        run: tests/spark-joy.test.sh
      - name: Gate-notify hook
        run: tests/gate-notify.test.sh
      - name: Skill ledger hook
        run: tests/skill_ledger_approved_examples.test.sh
      - name: Idle skills
        run: tests/idle_skills_approved_examples.test.sh
      - name: Captain's log high points
        run: tests/captains_log_high_points_approved_examples.test.sh
      - name: Reader panel
        run: tests/reader_panel_approved_examples.test.sh
      - name: Ticket-drift hook
        run: tests/ticket_drift_approved_examples.test.sh
