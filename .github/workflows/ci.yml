  red-first:
    runs-on: ubuntu-latest
    # Runs each approved test the branch adds at the commit that added it,
    # apart from checks so neither job nears its cap.
    timeout-minutes: 8
    if: github.event_name == 'pull_request'
    steps:
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads the commits that added each approved test.
          fetch-depth: 0
      # An approved test fails for a missing tool as well as a missing
      # behaviour, so this job has the same tools as checks.
      # The runner image has no JSON Schema validator, and this job has no declared shell to hold one.
      - name: Install check-jsonschema, the security kit's OSV file check
        run: pipx install check-jsonschema==0.38.0
      # The case-file build shrinks screenshots with ImageMagick, prints its PDF
      # with a headless browser, and its check reads the PDF with pdftotext.
      # apt-get update took 2m30s on one run, so it runs only when the
      # image's package lists can't install them.
      - name: Install ImageMagick and poppler-utils, and name the runner's Chrome as chromium, for the case-file build
        run: |
          pkgs=(); command -v convert >/dev/null || pkgs+=(imagemagick); command -v pdftotext >/dev/null || pkgs+=(poppler-utils)
          if [ ${#pkgs[@]} -gt 0 ]; then
            sudo apt-get install -y -q "${pkgs[@]}" || { sudo apt-get update -q && sudo apt-get install -y -q "${pkgs[@]}"; }
          fi
          command -v chromium >/dev/null || sudo ln -s "$(command -v google-chrome)" /usr/local/bin/chromium
      # The viewscreen band is a function-hook module; only Claude Code's own
      # mod test kit can load it.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: Red-first check
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          added=$(git log --diff-filter=A --format=%H -1 -- plugins/vicky-skills/scripts/red-first-check.sh)
          if ! git merge-base --is-ancestor "$added" "$base"; then base=$added; fi
          plugins/vicky-skills/scripts/red-first-check.sh "$base"
  mutation-load:
    runs-on: ubuntu-latest
    # Real mutation passes, slow on purpose, so they keep their own cap.
    timeout-minutes: 5
    steps:
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A machine's load decides no mutant's verdict
        run: tests/mutation_load_approved_examples.test.sh
      - name: Looping, waiting and slow mutants
        run: tests/mutation-load.test.sh
