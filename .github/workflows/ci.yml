name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft fails here and runs nothing else. Skipping would report as
      # passed and let a draft merge.
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The red-first check reads the commits that added each approved test.
          fetch-depth: 0
      - name: Plugin layout
        run: tests/plugin-layout.test.sh
      - name: Familiar watch script
        run: tests/familiar_watch_approved_examples.test.sh
      - name: Familiar skill and voice
        run: tests/familiar_approved_examples.test.sh
      - name: Familiar catches new sessions
        run: tests/familiar_catchup_approved_examples.test.sh
      - name: Familiar scripts edge cases
        run: tests/familiar.test.sh
      - name: Approved-spec guard
