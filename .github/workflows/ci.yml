      - name: Red-first check
        if: github.event_name == 'pull_request'
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          added=$(git log --diff-filter=A --format=%H -1 -- plugins/vicky-skills/scripts/red-first-check.sh)
          if ! git merge-base --is-ancestor "$added" "$base"; then base=$added; fi
          plugins/vicky-skills/scripts/red-first-check.sh "$base"
